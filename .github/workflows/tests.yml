name: tests

on:
  pull_request:
    types: [opened, ready_for_review, synchronize]
  push:
    branches: [main]

jobs:
  pytest:
    # Skips draft PRs.
    if: github.event_name != 'pull_request' || !github.event.pull_request.draft
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.1.0
        with:
          enable-cache: true
      - run: uv sync --locked --python 3.13
      # No path arg: collect the testpaths configured in pyproject.toml. The raster tests skip
      # here (no resvg); the job below is the one that runs them.
      - run: uv run pytest

  pytest-raster:
    # The `raster` extra (resvg, a self-contained wheel). Its tests skip when the import fails,
    # which reads as a pass, so the import is asserted before pytest runs.
    if: github.event_name != 'pull_request' || !github.event.pull_request.draft
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.1.0
        with:
          enable-cache: true
      - run: uv sync --locked --python 3.13 --extra raster
      - run: uv run python -c "import resvg_py"
      - run: uv run pytest tests/test_render_raster.py

  pytest-highs:
    # The `highs` extra (the floating-point x-solve backend). Its agreement tests skip when highspy is missing,
    # which reads as a pass, so the import is asserted before pytest runs.
    if: github.event_name != 'pull_request' || !github.event.pull_request.draft
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.1.0
        with:
          enable-cache: true
      - run: uv sync --locked --python 3.13 --extra highs
      - run: uv run python -c "import highspy"
      - run: uv run pytest tests/test_xsolve.py

  wheel:
    # The installed package, not the source tree: the wheel lists its files one by one (only-include), and a module
    # left out of that list passes every test above while breaking every install. Build the wheel, install it alone
    # into a fresh environment without extras, import every module in it, then add the `render` extra and draw a golden
    # through the CLI.
    if: github.event_name != 'pull_request' || !github.event.pull_request.draft
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.1.0
        with:
          enable-cache: true
      - run: uv build --wheel -o dist
      - run: uv venv --python 3.13 /tmp/wheel-env
      - run: uv pip install --python /tmp/wheel-env dist/*.whl
      - name: import every module from the installed wheel
        working-directory: /tmp
        run: |
          /tmp/wheel-env/bin/python - <<'PY'
          import importlib, importlib.util, pkgutil
          import grus
          names = [m.name for m in pkgutil.walk_packages(grus.__path__, "grus.")]
          import grus.models  # a namespace package (no __init__), which walk_packages does not descend into
          names += [f"grus.models.{m.name}" for m in pkgutil.iter_modules(grus.models.__path__)]
          for name in names:
              importlib.import_module(name)
          assert "grus.render" in names and "grus.models.layout_pb2" in names, names
          assert importlib.util.find_spec("z3") is None, "z3 installed without the render extra"
          print(f"imported {len(names)} modules")
          PY
      - name: ship each stub's .proto at the path it registers
        # -I keeps the checkout off sys.path, so grus is the installed wheel while schema/ is read from the checkout.
        run: |
          /tmp/wheel-env/bin/python -I - <<'PY'
          import importlib, pathlib, pkgutil
          import grus.models
          site = pathlib.Path(grus.models.__path__[0]).parents[1]
          for m in pkgutil.iter_modules(grus.models.__path__):
              registered = importlib.import_module(f"grus.models.{m.name}").DESCRIPTOR.name
              shipped = site / registered
              assert shipped.read_text() == pathlib.Path("schema/proto", registered).read_text(), registered
              print(f"ships {registered}")
          PY
      - name: lay out and draw a golden through the installed CLI
        run: |-
          uv pip install --python /tmp/wheel-env "$(ls dist/*.whl)[render]"
          /tmp/wheel-env/bin/grus layout tests/goldens/trio.pbtxt -o /tmp/trio.layout.pbtxt
          /tmp/wheel-env/bin/grus render tests/goldens/trio.pbtxt --layout /tmp/trio.layout.pbtxt -o /tmp/trio.svg
          test -s /tmp/trio.svg
