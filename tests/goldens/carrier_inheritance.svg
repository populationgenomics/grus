<svg xmlns="http://www.w3.org/2000/svg" width="340" height="191" viewBox="0 0 340 191" class="pedigree" data-title="Carriers by inheritance: AR and X-linked alike under PARTITION_FILL, a dot for X-linked under INHERITANCE_GLYPH" data-conditions="[&quot;&quot;]">
